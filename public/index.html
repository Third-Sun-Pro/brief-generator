<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brief Generator - Third Sun Productions</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap');

    :root {
      --cream: #EAE1CB;
      --pink: #D18E97;
      --green: #979E6C;
      --brown: #5B3B1E;
      --gold: #D2A432;
      --orange: #BC5727;
      --cream-light: #f3efe6;
      --cream-dark: #ddd4be;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--cream-light);
      color: var(--brown);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(91, 59, 30, 0.10), 0 1px 4px rgba(91, 59, 30, 0.06);
      padding: 3rem;
      max-width: 500px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--pink), var(--green), var(--cream), var(--pink));
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.3rem;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--green);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--brown);
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--green);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 2.25rem;
      letter-spacing: 0.02em;
    }

    .upload-area {
      margin-bottom: 1rem;
    }

    .upload-label {
      display: block;
      font-weight: 600;
      font-size: 0.8rem;
      margin-bottom: 0.5rem;
      color: var(--brown);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .upload-zone {
      position: relative;
      border: 2px dashed var(--cream-dark);
      border-radius: 12px;
      padding: 1.25rem 1rem;
      background: var(--cream-light);
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .upload-zone:hover {
      border-color: var(--pink);
      background: #f5eced;
    }

    .upload-zone.has-file {
      border-color: var(--green);
      border-style: solid;
      background: #f0f1e8;
    }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .upload-icon {
      display: inline-block;
      width: 32px;
      height: 32px;
      margin-bottom: 0.4rem;
    }

    .upload-text {
      font-size: 0.85rem;
      color: #9a8a6e;
    }

    .upload-text strong {
      color: var(--pink);
    }

    .file-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .file-name svg {
      width: 16px;
      height: 16px;
      fill: var(--green);
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.9rem;
      background: var(--pink);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 0.75rem;
      letter-spacing: 0.01em;
    }

    button[type="submit"]:hover {
      background: #c07a83;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(209, 142, 151, 0.35);
    }

    button[type="submit"]:disabled {
      background: #d4b8bc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .cancel-btn {
      width: 100%;
      padding: 0.75rem;
      background: transparent;
      color: var(--orange);
      border: 2px solid var(--orange);
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 0.5rem;
    }

    .cancel-btn:hover {
      background: #f9eeea;
    }

    .status {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: var(--brown);
      font-weight: 500;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2.5px solid var(--cream-dark);
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .downloads {
      margin-top: 1.5rem;
      display: flex;
      gap: 0.75rem;
    }

    .downloads a, .downloads button {
      flex: 1;
      text-align: center;
      padding: 0.75rem;
      border-radius: 12px;
      text-decoration: none;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .downloads a svg, .downloads button svg {
      width: 16px;
      height: 16px;
    }

    .dl-docx {
      background: var(--green);
      color: #fff;
    }
    .dl-docx:hover {
      background: #858c5e;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(151, 158, 108, 0.3);
    }
    .dl-docx svg { fill: #fff; }

    .dl-md {
      background: var(--cream);
      color: var(--brown);
    }
    .dl-md:hover {
      background: var(--cream-dark);
      transform: translateY(-1px);
    }
    .dl-md svg { fill: var(--brown); }

    .dl-copy {
      background: var(--cream);
      color: var(--brown);
      border: none;
      cursor: pointer;
    }
    .dl-copy:hover {
      background: var(--cream-dark);
      transform: translateY(-1px);
    }
    .dl-copy svg { fill: var(--brown); width: 16px; height: 16px; }

    .preview {
      margin-top: 1.5rem;
      background: var(--cream-light);
      border: 1px solid var(--cream-dark);
      border-radius: 12px;
      padding: 1.25rem;
      max-height: 400px;
      overflow-y: auto;
      font-size: 0.82rem;
      line-height: 1.6;
      word-wrap: break-word;
      font-family: 'DM Sans', sans-serif;
      color: var(--brown);
    }

    .preview h1, .commonalities-content h1 { font-size: 1.3rem; font-weight: 700; margin: 1.25rem 0 0.5rem; color: var(--brown); }
    .preview h2, .commonalities-content h2 { font-size: 1.1rem; font-weight: 600; margin: 1rem 0 0.4rem; color: var(--brown); }
    .preview h3, .commonalities-content h3 { font-size: 0.95rem; font-weight: 600; margin: 0.85rem 0 0.35rem; color: var(--green); }
    .preview h1:first-child, .preview h2:first-child, .preview h3:first-child,
    .commonalities-content h1:first-child, .commonalities-content h2:first-child, .commonalities-content h3:first-child { margin-top: 0; }
    .preview p, .commonalities-content p { margin: 0.5rem 0; }
    .preview ul, .preview ol, .commonalities-content ul, .commonalities-content ol { margin: 0.5rem 0; padding-left: 1.5rem; }
    .preview li, .commonalities-content li { margin: 0.2rem 0; }
    .preview strong, .commonalities-content strong { font-weight: 600; color: var(--brown); }
    .preview em, .commonalities-content em { font-style: italic; }
    .preview hr, .commonalities-content hr { border: none; border-top: 1px solid var(--cream-dark); margin: 1rem 0; }

    .preview-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--green);
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .error {
      color: var(--orange);
      background: #f9eeea;
      border: 1px solid #e8d0c4;
      border-radius: 12px;
      padding: 0.85rem 1rem;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .error[hidden] { display: none; }

    .retry-btn {
      flex-shrink: 0;
      padding: 0.4rem 0.85rem;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .retry-btn:hover {
      background: #a34b20;
      transform: translateY(-1px);
    }

    .divider {
      height: 1px;
      background: var(--cream-dark);
      margin: 1.75rem 0;
    }

    .upload-error {
      color: var(--orange);
      font-size: 0.8rem;
      font-weight: 500;
      margin-top: 0.4rem;
    }

    .upload-zone.has-error {
      border-color: var(--orange);
      border-style: solid;
      background: #f9eeea;
    }

    .revision-textarea {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 2px solid var(--cream-dark);
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--brown);
      background: var(--cream-light);
      resize: vertical;
      min-height: 80px;
      transition: border-color 0.25s ease;
    }

    .revision-textarea:focus {
      outline: none;
      border-color: var(--pink);
    }

    .revision-textarea::placeholder {
      color: #b3a68e;
    }

    .revise-btn {
      width: 100%;
      padding: 0.9rem;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 0.75rem;
      letter-spacing: 0.01em;
    }

    .revise-btn:hover {
      background: #858c5e;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(151, 158, 108, 0.3);
    }

    .revise-btn:disabled {
      background: #bcc0a3;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .url-input {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 2px solid var(--cream-dark);
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--brown);
      background: var(--cream-light);
      transition: border-color 0.25s ease;
    }

    .url-input:focus {
      outline: none;
      border-color: var(--pink);
    }

    .url-input::placeholder {
      color: #b3a68e;
    }

    .optional-note {
      font-weight: 400;
      text-transform: none;
      letter-spacing: normal;
      color: #9a8a6e;
    }

    .warning {
      color: var(--gold);
      background: #faf5e8;
      border: 1px solid #e8d9a8;
      border-radius: 12px;
      padding: 0.85rem 1rem;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .session-expiry {
      font-size: 0.8rem;
      font-weight: 500;
      margin-top: 0.5rem;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      text-align: center;
    }

    .session-expiry.expiry-ok {
      color: #9a8a6e;
    }

    .session-expiry.expiry-warn {
      color: var(--gold);
      background: #faf5e8;
      border: 1px solid #e8d9a8;
    }

    .session-expiry.expiry-expired {
      color: var(--orange);
      background: #f9eeea;
      border: 1px solid #e8d0c4;
    }

    .commonalities-section {
      margin-top: 1.5rem;
    }

    .commonalities-toggle {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #f0f1e8;
      color: var(--green);
      border: 1px solid #d4d8b8;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .commonalities-toggle:hover {
      background: #e6e8d4;
    }

    .commonalities-toggle .chevron {
      transition: transform 0.25s ease;
      font-size: 0.7rem;
    }

    .commonalities-toggle.open .chevron {
      transform: rotate(180deg);
    }

    .commonalities-content {
      margin-top: 0.75rem;
      background: var(--cream-light);
      border: 1px solid var(--cream-dark);
      border-radius: 12px;
      padding: 1.25rem;
      max-height: 400px;
      overflow-y: auto;
      font-size: 0.82rem;
      line-height: 1.6;
      word-wrap: break-word;
      font-family: 'DM Sans', sans-serif;
      color: var(--brown);
    }

    .commonalities-downloads {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    .commonalities-downloads a {
      flex: 1;
      text-align: center;
      padding: 0.55rem;
      border-radius: 10px;
      text-decoration: none;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.78rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .commonalities-downloads a svg {
      width: 14px;
      height: 14px;
    }

    .commonalities-downloads .dl-docx { background: var(--green); color: #fff; }
    .commonalities-downloads .dl-docx:hover { background: #858c5e; transform: translateY(-1px); }
    .commonalities-downloads .dl-docx svg { fill: #fff; }
    .commonalities-downloads .dl-md { background: var(--cream); color: var(--brown); }
    .commonalities-downloads .dl-md:hover { background: var(--cream-dark); transform: translateY(-1px); }
    .commonalities-downloads .dl-md svg { fill: var(--brown); }

    .archive-toggle {
      width: 100%;
      padding: 0.75rem;
      background: var(--cream);
      color: var(--brown);
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .archive-toggle:hover {
      background: var(--cream-dark);
      transform: translateY(-1px);
    }

    .archive-toggle svg {
      width: 16px;
      height: 16px;
      fill: var(--brown);
    }

    .archive-list {
      margin-top: 1rem;
    }

    .archive-empty {
      text-align: center;
      color: #9a8a6e;
      font-size: 0.85rem;
      padding: 1.5rem 0;
    }

    .archive-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--cream-dark);
    }

    .archive-item:last-child {
      border-bottom: none;
    }

    .archive-item-info {
      flex: 1;
      min-width: 0;
    }

    .archive-item-name {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--brown);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .archive-item-meta {
      font-size: 0.75rem;
      color: #9a8a6e;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.15rem;
    }

    .archive-badge {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
    }

    .badge-generate {
      background: #f0f1e8;
      color: var(--green);
    }

    .badge-revise {
      background: #f2dce0;
      color: var(--pink);
    }

    .archive-item-actions {
      display: flex;
      gap: 0.35rem;
      flex-shrink: 0;
      margin-left: 0.5rem;
    }

    .archive-dl-btn {
      padding: 0.35rem 0.55rem;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .archive-dl-btn:hover {
      transform: translateY(-1px);
    }

    .archive-dl-docx {
      background: var(--green);
      color: #fff;
    }

    .archive-dl-md {
      background: var(--cream);
      color: var(--brown);
    }

    .hidden { display: none !important; }

    .login-overlay {
      position: fixed;
      inset: 0;
      background: var(--cream-light);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 2rem;
    }

    .login-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(91, 59, 30, 0.10), 0 1px 4px rgba(91, 59, 30, 0.06);
      padding: 3rem;
      max-width: 400px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--pink), var(--green), var(--cream), var(--pink));
    }

    .login-btn {
      width: 100%;
      padding: 0.9rem;
      background: var(--pink);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 0.75rem;
      letter-spacing: 0.01em;
    }

    .login-btn:hover {
      background: #c07a83;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(209, 142, 151, 0.35);
    }

    .login-btn:disabled {
      background: #d4b8bc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
  <div id="login-overlay" class="login-overlay">
    <div class="login-card">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 5.92A6 6 0 0 1 12 2zm0 3.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" fill="none"/><circle cx="12" cy="12" r="4" fill="#fff"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <h1>Brief Generator</h1>
      </div>
      <p class="subtitle">Third Sun Productions</p>
      <form id="login-form">
        <label class="upload-label" for="login-password">Password</label>
        <input type="password" id="login-password" class="url-input" placeholder="Enter team password" required autofocus>
        <button type="submit" class="login-btn" id="login-btn">Sign In</button>
      </form>
      <div id="login-error" class="error" role="alert" tabindex="-1" hidden></div>
    </div>
  </div>

  <div class="card hidden" id="main-card">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 5.92A6 6 0 0 1 12 2zm0 3.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" fill="none"/><circle cx="12" cy="12" r="4" fill="#fff"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <h1>Brief Generator</h1>
    </div>
    <p class="subtitle">Third Sun Productions</p>

    <form id="form">
      <div class="upload-area">
        <label class="upload-label" for="csv">Client Questionnaire</label>
        <div class="upload-zone" id="csv-zone">
          <div class="upload-icon">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="6" y="2" width="20" height="28" rx="3" fill="#e8eadb" stroke="#979E6C" stroke-width="1.5"/>
              <path d="M11 12h10M11 16h10M11 20h6" stroke="#979E6C" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <p class="upload-text"><strong>Choose CSV file(s)</strong> or drag them here</p>
          <input type="file" id="csv" name="csv" accept=".csv" multiple required
            aria-describedby="csv-error">
        </div>
      </div>

      <div class="upload-area">
        <label class="upload-label" for="scope">Project Scope</label>
        <textarea id="scope" name="scope" class="revision-textarea" required
          placeholder="Paste or type the project scope, deliverables, timeline..." rows="4"></textarea>
      </div>

      <div class="upload-area">
        <label class="upload-label" for="notes">Supporting Documents <span class="optional-note">(optional)</span></label>
        <div class="upload-zone" id="notes-zone">
          <div class="upload-icon">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="6" y="2" width="20" height="28" rx="3" fill="#f2dce0" stroke="#D18E97" stroke-width="1.5"/>
              <path d="M11 12h10M11 16h10M11 20h6" stroke="#D18E97" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <p class="upload-text"><strong>Choose file(s)</strong> or drag here — PDF, DOCX, TXT, MD</p>
          <input type="file" id="notes" name="notes" accept=".pdf,.docx,.txt,.md" multiple>
        </div>
      </div>

      <div class="upload-area">
        <label class="upload-label" for="siteUrl">Current Website URL <span class="optional-note">(optional)</span></label>
        <input type="url" id="siteUrl" name="siteUrl" class="url-input"
          placeholder="https://www.clientsite.com">
      </div>

      <div class="divider"></div>

      <button type="submit" id="btn">Generate Brief</button>
      <button type="button" id="cancel-btn" class="cancel-btn" hidden>Cancel</button>
    </form>

    <div id="status" class="status" aria-live="polite" hidden></div>
    <div id="preview-label" class="preview-label" hidden>Live Preview</div>
    <div id="preview" class="preview" hidden></div>
    <div id="downloads" class="downloads" hidden></div>
    <div id="commonalities-section" class="commonalities-section" hidden>
      <button type="button" id="commonalities-toggle" class="commonalities-toggle">
        Respondent Commonalities <span class="chevron">&#9660;</span>
      </button>
      <div id="commonalities-panel" hidden>
        <div id="commonalities-content" class="commonalities-content"></div>
        <div id="commonalities-downloads" class="commonalities-downloads"></div>
      </div>
    </div>
    <div id="revision-area" hidden>
      <div class="divider"></div>
      <label class="upload-label" for="feedback">Revise Brief</label>
      <textarea id="feedback" class="revision-textarea"
        placeholder="e.g. Make the tone more formal, add more detail to the Goals section..."
        rows="3" aria-describedby="error"></textarea>
      <button type="button" id="revise-btn" class="revise-btn">Revise Brief</button>
      <div id="session-expiry" class="session-expiry" role="status" aria-live="polite" hidden></div>
    </div>
    <button type="button" id="new-brief-btn" class="cancel-btn" hidden>New Brief</button>
    <div id="warning" class="warning" role="status" hidden></div>
    <div id="error" class="error" role="alert" tabindex="-1" hidden>
      <span id="error-text"></span>
      <button type="button" id="retry-btn" class="retry-btn">Retry</button>
    </div>

    <button type="button" id="archive-toggle" class="archive-toggle">
      <svg viewBox="0 0 24 24"><path d="M20 6H4V4h16v2zm-1 2H5c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h14c.55 0 1-.45 1-1V9c0-.55-.45-1-1-1zm-5 7H10v-2h4v2z"/></svg>
      Past Briefs
    </button>
    <div id="archive-list" class="archive-list hidden"></div>
  </div>

  <script>
    // -----------------------------------------------------------------------
    // Auth
    // -----------------------------------------------------------------------
    const loginOverlay = document.getElementById("login-overlay");
    const mainCard = document.getElementById("main-card");
    const loginForm = document.getElementById("login-form");
    const loginBtn = document.getElementById("login-btn");
    const loginError = document.getElementById("login-error");
    const loginPassword = document.getElementById("login-password");

    function showLogin() {
      loginOverlay.classList.remove("hidden");
      mainCard.classList.add("hidden");
      loginPassword.value = "";
      loginError.hidden = true;
    }

    function showApp() {
      loginOverlay.classList.add("hidden");
      mainCard.classList.remove("hidden");
    }

    // Check auth on page load
    (async () => {
      try {
        const res = await fetch("/auth-check");
        const data = await res.json();
        if (data.authenticated) showApp();
      } catch (_) { /* show login by default */ }
    })();

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginBtn.disabled = true;
      loginError.hidden = true;
      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: loginPassword.value }),
        });
        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.error || "Login failed");
        }
        showApp();
      } catch (err) {
        loginError.textContent = err.message;
        loginError.hidden = false;
        loginPassword.focus();
      } finally {
        loginBtn.disabled = false;
      }
    });

    // Helper: handle 401 from any fetch
    function handle401(res) {
      if (res.status === 401) {
        showLogin();
        return true;
      }
      return false;
    }

    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const statusEl = document.getElementById("status");
    const previewLabel = document.getElementById("preview-label");
    const previewEl = document.getElementById("preview");
    const downloadsEl = document.getElementById("downloads");
    const errorEl = document.getElementById("error");
    const warningEl = document.getElementById("warning");
    const revisionArea = document.getElementById("revision-area");
    const feedbackEl = document.getElementById("feedback");
    const reviseBtn = document.getElementById("revise-btn");
    let currentSessionId = null;
    let timerInterval = null;
    let sessionExpiryInterval = null;
    let currentAbortController = null;
    const sessionExpiryEl = document.getElementById("session-expiry");
    const cancelBtn = document.getElementById("cancel-btn");
    const newBriefBtn = document.getElementById("new-brief-btn");
    const commonalitiesSection = document.getElementById("commonalities-section");
    const commonalitiesToggle = document.getElementById("commonalities-toggle");
    const commonalitiesPanel = document.getElementById("commonalities-panel");
    const commonalitiesContent = document.getElementById("commonalities-content");
    const commonalitiesDlEl = document.getElementById("commonalities-downloads");
    let currentCommonalities = null;
    const errorText = document.getElementById("error-text");
    const retryBtn = document.getElementById("retry-btn");
    let lastErrorSource = null;

    function showError(message, source) {
      errorText.textContent = message;
      lastErrorSource = source || null;
      retryBtn.hidden = !source;
      errorEl.hidden = false;
      errorEl.focus();
    }

    retryBtn.addEventListener("click", () => {
      errorEl.hidden = true;
      if (lastErrorSource === "generate") {
        form.requestSubmit();
      } else if (lastErrorSource === "revise") {
        reviseBtn.click();
      }
    });

    function startSessionExpiry(ttlMs) {
      clearSessionExpiry();
      const expiresAt = Date.now() + ttlMs;
      const warnAt = ttlMs - 5 * 60 * 1000; // warn with 5 min left

      function tick() {
        const remaining = expiresAt - Date.now();
        if (remaining <= 0) {
          clearSessionExpiry();
          currentSessionId = null;
          sessionExpiryEl.className = "session-expiry expiry-expired";
          sessionExpiryEl.textContent = "Revision session expired. Generate a new brief to revise.";
          sessionExpiryEl.hidden = false;
          reviseBtn.disabled = true;
          feedbackEl.disabled = true;
          setFormDisabled(false);
          return;
        }
        const mins = Math.floor(remaining / 60000);
        const secs = Math.floor((remaining % 60000) / 1000);
        const timeStr = mins + ":" + String(secs).padStart(2, "0");
        if (remaining <= 5 * 60 * 1000) {
          sessionExpiryEl.className = "session-expiry expiry-warn";
          sessionExpiryEl.textContent = "Session expires in " + timeStr + " — revise soon or generate a new brief.";
        } else {
          sessionExpiryEl.className = "session-expiry expiry-ok";
          sessionExpiryEl.textContent = "Session expires in " + timeStr;
        }
        sessionExpiryEl.hidden = false;
      }

      tick();
      sessionExpiryInterval = setInterval(tick, 1000);
    }

    function clearSessionExpiry() {
      if (sessionExpiryInterval) { clearInterval(sessionExpiryInterval); sessionExpiryInterval = null; }
      sessionExpiryEl.hidden = true;
    }

    function startTimer(label) {
      const start = Date.now();
      statusEl.hidden = false;
      function tick() {
        const elapsed = Math.floor((Date.now() - start) / 1000);
        statusEl.innerHTML = '<span class="spinner"></span>' + label + " (" + elapsed + "s)";
      }
      tick();
      timerInterval = setInterval(tick, 1000);
    }

    function stopTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }

    function setFormDisabled(disabled) {
      document.getElementById("csv").disabled = disabled;
      document.getElementById("scope").disabled = disabled;
      document.getElementById("notes").disabled = disabled;
      document.getElementById("siteUrl").disabled = disabled;
      btn.disabled = disabled;
      // Make upload zones visually inert
      document.getElementById("csv-zone").style.pointerEvents = disabled ? "none" : "";
      document.getElementById("csv-zone").style.opacity = disabled ? "0.5" : "";
      document.getElementById("notes-zone").style.pointerEvents = disabled ? "none" : "";
      document.getElementById("notes-zone").style.opacity = disabled ? "0.5" : "";
    }

    let hasUnsavedBrief = false;

    window.addEventListener("beforeunload", (e) => {
      if (hasUnsavedBrief) {
        e.preventDefault();
      }
    });

    function createDownloadLinks(json) {
      const docxBlob = new Blob(
        [Uint8Array.from(atob(json.docxBase64), (c) => c.charCodeAt(0))],
        { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" }
      );
      const mdBlob = new Blob([json.markdown], { type: "text/markdown" });
      const timestamp = new Date().toISOString().slice(0, 10);
      const slug = json.clientName
        ? json.clientName.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "")
        : null;
      const baseName = slug ? `creative-brief-${slug}-${timestamp}` : `creative-brief-${timestamp}`;

      const docxLink = document.createElement("a");
      docxLink.href = URL.createObjectURL(docxBlob);
      docxLink.download = `${baseName}.docx`;
      docxLink.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Pages / Word';
      docxLink.className = "dl-docx";

      const mdLink = document.createElement("a");
      mdLink.href = URL.createObjectURL(mdBlob);
      mdLink.download = `${baseName}.md`;
      mdLink.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Markdown';
      mdLink.className = "dl-md";

      docxLink.addEventListener("click", () => { hasUnsavedBrief = false; });
      mdLink.addEventListener("click", () => { hasUnsavedBrief = false; });

      const copyBtn = document.createElement("button");
      copyBtn.type = "button";
      copyBtn.className = "dl-copy";
      copyBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>Copy';
      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(json.markdown);
          copyBtn.textContent = "Copied!";
          setTimeout(() => {
            copyBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>Copy';
          }, 2000);
        } catch (_) {
          copyBtn.textContent = "Failed";
        }
      });

      downloadsEl.appendChild(docxLink);
      downloadsEl.appendChild(mdLink);
      downloadsEl.appendChild(copyBtn);
      downloadsEl.hidden = false;
      hasUnsavedBrief = true;
    }

    function cancelStream() {
      if (currentAbortController) {
        currentAbortController.abort();
        currentAbortController = null;
      }
    }

    cancelBtn.addEventListener("click", cancelStream);

    newBriefBtn.addEventListener("click", () => {
      currentSessionId = null;
      clearSessionExpiry();
      revisionArea.hidden = true;
      feedbackEl.value = "";
      downloadsEl.hidden = true;
      downloadsEl.innerHTML = "";
      previewEl.hidden = true;
      previewLabel.hidden = true;
      previewEl.innerHTML = "";
      markdownAccumulator = "";
      statusEl.hidden = true;
      errorEl.hidden = true;
      warningEl.hidden = true;
      newBriefBtn.hidden = true;
      hasUnsavedBrief = false;
      resetCommonalities();
      setFormDisabled(false);
    });

    // Commonalities toggle
    commonalitiesToggle.addEventListener("click", function () {
      const isOpen = !commonalitiesPanel.hidden;
      commonalitiesPanel.hidden = isOpen;
      this.classList.toggle("open", !isOpen);
    });

    function createCommonalitiesDownloads(commonalities, clientName) {
      commonalitiesDlEl.innerHTML = "";
      const docxBlob = new Blob(
        [Uint8Array.from(atob(commonalities.docxBase64), (c) => c.charCodeAt(0))],
        { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" }
      );
      const mdBlob = new Blob([commonalities.markdown], { type: "text/markdown" });
      const timestamp = new Date().toISOString().slice(0, 10);
      const slug = clientName
        ? clientName.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "")
        : null;
      const baseName = slug ? `commonalities-${slug}-${timestamp}` : `commonalities-${timestamp}`;

      const docxLink = document.createElement("a");
      docxLink.href = URL.createObjectURL(docxBlob);
      docxLink.download = `${baseName}.docx`;
      docxLink.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Pages / Word';
      docxLink.className = "dl-docx";

      const mdLink = document.createElement("a");
      mdLink.href = URL.createObjectURL(mdBlob);
      mdLink.download = `${baseName}.md`;
      mdLink.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Markdown';
      mdLink.className = "dl-md";

      commonalitiesDlEl.appendChild(docxLink);
      commonalitiesDlEl.appendChild(mdLink);
    }

    function resetCommonalities() {
      currentCommonalities = null;
      commonalitiesSection.hidden = true;
      commonalitiesPanel.hidden = true;
      commonalitiesContent.innerHTML = "";
      commonalitiesDlEl.innerHTML = "";
      commonalitiesToggle.classList.remove("open");
    }

    // Markdown preview rendering
    marked.use({ breaks: true, gfm: true });
    let markdownAccumulator = "";
    let renderScheduled = false;

    function scheduleRender() {
      if (renderScheduled) return;
      renderScheduled = true;
      requestAnimationFrame(() => {
        renderScheduled = false;
        previewEl.innerHTML = DOMPurify.sanitize(marked.parse(markdownAccumulator));
        previewEl.scrollTop = previewEl.scrollHeight;
      });
    }

    function finalRender() {
      renderScheduled = false;
      previewEl.innerHTML = DOMPurify.sanitize(marked.parse(markdownAccumulator));
      previewEl.scrollTop = previewEl.scrollHeight;
    }

    // Auto-save scope text to localStorage
    const scopeEl = document.getElementById("scope");
    const SCOPE_KEY = "brief-generator-scope";
    const saved = localStorage.getItem(SCOPE_KEY);
    if (saved && !scopeEl.value) scopeEl.value = saved;
    scopeEl.addEventListener("input", () => {
      localStorage.setItem(SCOPE_KEY, scopeEl.value);
    });

    // CSV client-side validation
    let csvValid = false;

    function validateCsvText(text) {
      if (!text || !text.trim()) return "CSV file is empty.";
      const lines = text.trim().split(/\r?\n/).filter((l) => l.trim() !== "");
      if (!lines[0].includes(",")) return "File does not appear to be a valid CSV (no commas found).";
      if (lines.length < 2) return "CSV has no data rows (only a header was found).";
      return null;
    }

    function clearUploadError(zone) {
      zone.classList.remove("has-error");
      const input = zone.querySelector("input[type='file']");
      if (input) input.removeAttribute("aria-invalid");
      const existing = zone.parentElement.querySelector(".upload-error");
      if (existing) existing.remove();
    }

    function showUploadError(zone, message) {
      clearUploadError(zone);
      zone.classList.add("has-error");
      zone.classList.remove("has-file");
      const input = zone.querySelector("input[type='file']");
      if (input) input.setAttribute("aria-invalid", "true");
      const el = document.createElement("p");
      el.className = "upload-error";
      el.id = (input && input.id ? input.id : "upload") + "-error";
      el.role = "alert";
      el.textContent = message;
      zone.parentElement.appendChild(el);
    }

    // File input display — Notes (no validation needed)
    document.getElementById("notes").addEventListener("change", function () {
      const zone = this.closest(".upload-zone");
      if (this.files.length) {
        zone.classList.add("has-file");
        zone.querySelector(".upload-icon").hidden = true;
        const names = Array.from(this.files).map((f) => f.name);
        const label = names.length === 1 ? names[0] : `${names.length} files selected`;
        zone.querySelector(".upload-text").innerHTML =
          '<span class="file-name"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>' +
          label + '</span>';
      } else {
        zone.classList.remove("has-file");
        zone.querySelector(".upload-icon").hidden = false;
        zone.querySelector(".upload-text").innerHTML = '<strong>Choose file(s)</strong> or drag here — PDF, DOCX, TXT, MD';
      }
    });

    // File input display — CSV (with validation)
    document.getElementById("csv").addEventListener("change", async function () {
      const zone = this.closest(".upload-zone");
      clearUploadError(zone);
      csvValid = false;

      if (!this.files.length) return;

      const files = Array.from(this.files);
      for (const file of files) {
        const text = await file.text();
        const err = validateCsvText(text);
        if (err) {
          zone.querySelector(".upload-icon").hidden = false;
          zone.querySelector(".upload-text").innerHTML = '<strong>Choose CSV file(s)</strong> or drag them here';
          showUploadError(zone, files.length > 1 ? `${file.name}: ${err}` : err);
          this.value = "";
          return;
        }
      }

      csvValid = true;
      zone.classList.add("has-file");
      zone.querySelector(".upload-icon").hidden = true;
      const names = files.map((f) => f.name);
      const label = names.length === 1 ? names[0] : `${names.length} files selected`;
      zone.querySelector(".upload-text").innerHTML =
        '<span class="file-name"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>' +
        label + '</span>';
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const csvFiles = document.getElementById("csv").files;
      const scopeVal = document.getElementById("scope").value.trim();
      const notesFiles = document.getElementById("notes").files;
      if (!csvFiles.length || !scopeVal) return;
      if (!csvValid) return;

      currentSessionId = null;
      clearSessionExpiry();
      revisionArea.hidden = true;
      feedbackEl.value = "";
      downloadsEl.hidden = true;
      errorEl.hidden = true;
      warningEl.hidden = true;
      downloadsEl.innerHTML = "";
      previewEl.hidden = true;
      previewLabel.hidden = true;
      previewEl.innerHTML = "";
      markdownAccumulator = "";
      newBriefBtn.hidden = true;
      resetCommonalities();
      localStorage.removeItem(SCOPE_KEY);
      setFormDisabled(true);
      startTimer("Generating brief...");
      currentAbortController = new AbortController();
      cancelBtn.hidden = false;

      const formData = new FormData();
      for (const file of csvFiles) formData.append("csv", file);
      formData.append("scope", scopeVal);
      for (const file of notesFiles) formData.append("notes", file);
      const siteUrl = document.getElementById("siteUrl").value.trim();
      if (siteUrl) formData.append("siteUrl", siteUrl);

      try {
        const res = await fetch("/generate-stream", { method: "POST", body: formData, signal: currentAbortController.signal });

        if (handle401(res)) return;
        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.error || "Server error");
        }

        previewLabel.hidden = false;
        previewEl.hidden = false;

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const json = JSON.parse(line.slice(6));

            if (json.error) throw new Error(json.error);

            if (json.scrapeWarning) {
              warningEl.textContent = "Website scraping failed: " + json.scrapeWarning + " (brief generated without site data)";
              warningEl.hidden = false;
              continue;
            }

            if (json.done) {
              finalRender();
              createDownloadLinks(json);
              currentSessionId = json.sessionId;
              statusEl.innerHTML = "Done!";
              revisionArea.hidden = false;
              feedbackEl.disabled = false;
              reviseBtn.disabled = false;
              if (json.sessionTtl) startSessionExpiry(json.sessionTtl);
              if (json.archiveWarning) { warningEl.textContent = json.archiveWarning; warningEl.hidden = false; }
              if (json.commonalities) {
                currentCommonalities = json.commonalities;
                commonalitiesContent.innerHTML = DOMPurify.sanitize(marked.parse(json.commonalities.markdown));
                createCommonalitiesDownloads(json.commonalities, json.clientName);
                commonalitiesSection.hidden = false;
              }
              newBriefBtn.hidden = false;
              continue;
            }

            if (json.text) {
              markdownAccumulator += json.text;
              scheduleRender();
            }
          }
        }
      } catch (err) {
        if (err.name === "AbortError") {
          statusEl.innerHTML = "Cancelled.";
        } else {
          showError(err.message, "generate");
          statusEl.hidden = true;
        }
      } finally {
        stopTimer();
        currentAbortController = null;
        cancelBtn.hidden = true;
        if (!currentSessionId) setFormDisabled(false);
      }
    });

    // Revision handler
    reviseBtn.addEventListener("click", async () => {
      const feedback = feedbackEl.value.trim();
      if (!feedback) {
        feedbackEl.setAttribute("aria-invalid", "true");
        feedbackEl.focus();
        feedbackEl.style.borderColor = "var(--orange)";
        setTimeout(() => {
          feedbackEl.style.borderColor = "";
          feedbackEl.removeAttribute("aria-invalid");
        }, 2000);
        return;
      }
      if (!currentSessionId) {
        showError("Session expired. Please generate a new brief first.", null);
        return;
      }

      downloadsEl.hidden = true;
      downloadsEl.innerHTML = "";
      errorEl.hidden = true;
      previewEl.innerHTML = "";
      markdownAccumulator = "";
      previewLabel.hidden = false;
      previewLabel.textContent = "Revised Preview";
      previewEl.hidden = false;
      reviseBtn.disabled = true;
      setFormDisabled(true);
      startTimer("Revising brief...");
      currentAbortController = new AbortController();
      cancelBtn.hidden = false;

      try {
        const res = await fetch("/revise-stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId: currentSessionId, feedback }),
          signal: currentAbortController.signal,
        });

        if (handle401(res)) return;
        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.error || "Server error");
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const json = JSON.parse(line.slice(6));

            if (json.error) throw new Error(json.error);

            if (json.done) {
              finalRender();
              currentSessionId = json.sessionId;
              createDownloadLinks(json);
              statusEl.innerHTML = "Done!";
              feedbackEl.value = "";
              if (json.sessionTtl) startSessionExpiry(json.sessionTtl);
              if (json.archiveWarning) { warningEl.textContent = json.archiveWarning; warningEl.hidden = false; }
              continue;
            }

            if (json.text) {
              markdownAccumulator += json.text;
              scheduleRender();
            }
          }
        }
      } catch (err) {
        if (err.name === "AbortError") {
          statusEl.innerHTML = "Cancelled.";
        } else {
          showError(err.message, "revise");
          statusEl.hidden = true;
        }
      } finally {
        stopTimer();
        currentAbortController = null;
        cancelBtn.hidden = true;
        reviseBtn.disabled = false;
      }
    });
    // -----------------------------------------------------------------------
    // Archive
    // -----------------------------------------------------------------------
    const archiveToggle = document.getElementById("archive-toggle");
    const archiveListEl = document.getElementById("archive-list");
    let archiveOpen = false;

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })
        + " " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
    }

    async function fetchArchiveEntry(id, format) {
      const res = await fetch("/archive/" + id);
      if (handle401(res)) return;
      if (!res.ok) {
        const data = await res.json();
        throw new Error(data.error || "Failed to load entry");
      }
      const entry = await res.json();
      const slug = entry.clientName
        ? entry.clientName.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "")
        : null;
      const date = entry.createdAt.slice(0, 10);
      const baseName = slug ? "creative-brief-" + slug + "-" + date : "creative-brief-" + date;

      if (format === "docx") {
        const bytes = Uint8Array.from(atob(entry.docxBase64), (c) => c.charCodeAt(0));
        downloadBlob(
          new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" }),
          baseName + ".docx"
        );
      } else {
        downloadBlob(new Blob([entry.markdown], { type: "text/markdown" }), baseName + ".md");
      }
    }

    async function loadArchive() {
      archiveListEl.innerHTML = '<p class="archive-empty">Loading...</p>';
      try {
        const res = await fetch("/archive");
        if (handle401(res)) return;
        if (!res.ok) throw new Error("Failed to load archive");
        const entries = await res.json();

        if (!entries.length) {
          archiveListEl.innerHTML = '<p class="archive-empty">No briefs generated yet.</p>';
          return;
        }

        // Newest first
        entries.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        archiveListEl.innerHTML = entries.map((e) => {
          const badgeClass = e.source === "revise" ? "badge-revise" : "badge-generate";
          const badgeLabel = e.source === "revise" ? "Revised" : "Original";
          return '<div class="archive-item">' +
            '<div class="archive-item-info">' +
              '<div class="archive-item-name">' + escapeHtml(e.clientName) + '</div>' +
              '<div class="archive-item-meta">' +
                '<span>' + formatDate(e.createdAt) + '</span>' +
                '<span class="archive-badge ' + badgeClass + '">' + badgeLabel + '</span>' +
              '</div>' +
            '</div>' +
            '<div class="archive-item-actions">' +
              '<button class="archive-dl-btn archive-dl-docx" data-id="' + e.id + '" data-fmt="docx">Pages/Word</button>' +
              '<button class="archive-dl-btn archive-dl-md" data-id="' + e.id + '" data-fmt="md">Markdown</button>' +
            '</div>' +
          '</div>';
        }).join("");
      } catch (err) {
        archiveListEl.innerHTML = '<p class="archive-empty">' + escapeHtml(err.message) + '</p>';
      }
    }

    archiveToggle.addEventListener("click", () => {
      archiveOpen = !archiveOpen;
      if (archiveOpen) {
        archiveListEl.classList.remove("hidden");
        loadArchive();
      } else {
        archiveListEl.classList.add("hidden");
      }
    });

    archiveListEl.addEventListener("click", async (e) => {
      const btn = e.target.closest(".archive-dl-btn");
      if (!btn) return;
      btn.disabled = true;
      btn.textContent = "...";
      try {
        await fetchArchiveEntry(btn.dataset.id, btn.dataset.fmt);
      } catch (err) {
        showError(err.message, null);
      } finally {
        btn.disabled = false;
        btn.textContent = btn.dataset.fmt === "docx" ? "Pages/Word" : "Markdown";
      }
    });
  </script>
</body>
</html>
