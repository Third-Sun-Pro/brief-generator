<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brief Generator - Third Sun Productions</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap');

    :root {
      --cream: #EAE1CB;
      --pink: #D18E97;
      --green: #979E6C;
      --brown: #5B3B1E;
      --gold: #D2A432;
      --orange: #BC5727;
      --cream-light: #f3efe6;
      --cream-dark: #ddd4be;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--cream-light);
      color: var(--brown);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(91, 59, 30, 0.10), 0 1px 4px rgba(91, 59, 30, 0.06);
      padding: 3rem;
      max-width: 500px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--pink), var(--green), var(--cream), var(--pink));
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.3rem;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--green);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--brown);
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--green);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 2.25rem;
      letter-spacing: 0.02em;
    }

    .upload-area {
      margin-bottom: 1rem;
    }

    .upload-label {
      display: block;
      font-weight: 600;
      font-size: 0.8rem;
      margin-bottom: 0.5rem;
      color: var(--brown);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .upload-zone {
      position: relative;
      border: 2px dashed var(--cream-dark);
      border-radius: 12px;
      padding: 1.25rem 1rem;
      background: var(--cream-light);
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .upload-zone:hover {
      border-color: var(--pink);
      background: #f5eced;
    }

    .upload-zone.has-file {
      border-color: var(--green);
      border-style: solid;
      background: #f0f1e8;
    }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .upload-icon {
      display: inline-block;
      width: 32px;
      height: 32px;
      margin-bottom: 0.4rem;
    }

    .upload-text {
      font-size: 0.85rem;
      color: #9a8a6e;
    }

    .upload-text strong {
      color: var(--pink);
    }

    .file-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .file-name svg {
      width: 16px;
      height: 16px;
      fill: var(--green);
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.9rem;
      background: var(--pink);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 0.75rem;
      letter-spacing: 0.01em;
    }

    button[type="submit"]:hover {
      background: #c07a83;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(209, 142, 151, 0.35);
    }

    button[type="submit"]:disabled {
      background: #d4b8bc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .status {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: var(--brown);
      font-weight: 500;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2.5px solid var(--cream-dark);
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .downloads {
      margin-top: 1.5rem;
      display: flex;
      gap: 0.75rem;
    }

    .downloads a {
      flex: 1;
      text-align: center;
      padding: 0.75rem;
      border-radius: 12px;
      text-decoration: none;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .downloads a svg {
      width: 16px;
      height: 16px;
    }

    .dl-docx {
      background: var(--green);
      color: #fff;
    }
    .dl-docx:hover {
      background: #858c5e;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(151, 158, 108, 0.3);
    }
    .dl-docx svg { fill: #fff; }

    .dl-md {
      background: var(--cream);
      color: var(--brown);
    }
    .dl-md:hover {
      background: var(--cream-dark);
      transform: translateY(-1px);
    }
    .dl-md svg { fill: var(--brown); }

    .preview {
      margin-top: 1.5rem;
      background: var(--cream-light);
      border: 1px solid var(--cream-dark);
      border-radius: 12px;
      padding: 1.25rem;
      max-height: 400px;
      overflow-y: auto;
      font-size: 0.82rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'DM Sans', sans-serif;
      color: var(--brown);
    }

    .preview-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--green);
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .error {
      color: var(--orange);
      background: #f9eeea;
      border: 1px solid #e8d0c4;
      border-radius: 12px;
      padding: 0.85rem 1rem;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .divider {
      height: 1px;
      background: var(--cream-dark);
      margin: 1.75rem 0;
    }

    .upload-error {
      color: var(--orange);
      font-size: 0.8rem;
      font-weight: 500;
      margin-top: 0.4rem;
    }

    .upload-zone.has-error {
      border-color: var(--orange);
      border-style: solid;
      background: #f9eeea;
    }

    .revision-textarea {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 2px solid var(--cream-dark);
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--brown);
      background: var(--cream-light);
      resize: vertical;
      min-height: 80px;
      transition: border-color 0.25s ease;
    }

    .revision-textarea:focus {
      outline: none;
      border-color: var(--pink);
    }

    .revision-textarea::placeholder {
      color: #b3a68e;
    }

    .revise-btn {
      width: 100%;
      padding: 0.9rem;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 0.75rem;
      letter-spacing: 0.01em;
    }

    .revise-btn:hover {
      background: #858c5e;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(151, 158, 108, 0.3);
    }

    .revise-btn:disabled {
      background: #bcc0a3;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .url-input {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 2px solid var(--cream-dark);
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--brown);
      background: var(--cream-light);
      transition: border-color 0.25s ease;
    }

    .url-input:focus {
      outline: none;
      border-color: var(--pink);
    }

    .url-input::placeholder {
      color: #b3a68e;
    }

    .optional-note {
      font-weight: 400;
      text-transform: none;
      letter-spacing: normal;
      color: #9a8a6e;
    }

    .hidden { display: none !important; }

    .login-overlay {
      position: fixed;
      inset: 0;
      background: var(--cream-light);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 2rem;
    }

    .login-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(91, 59, 30, 0.10), 0 1px 4px rgba(91, 59, 30, 0.06);
      padding: 3rem;
      max-width: 400px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--pink), var(--green), var(--cream), var(--pink));
    }

    .login-btn {
      width: 100%;
      padding: 0.9rem;
      background: var(--pink);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 0.75rem;
      letter-spacing: 0.01em;
    }

    .login-btn:hover {
      background: #c07a83;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(209, 142, 151, 0.35);
    }

    .login-btn:disabled {
      background: #d4b8bc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div id="login-overlay" class="login-overlay">
    <div class="login-card">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 5.92A6 6 0 0 1 12 2zm0 3.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" fill="none"/><circle cx="12" cy="12" r="4" fill="#fff"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <h1>Brief Generator</h1>
      </div>
      <p class="subtitle">Third Sun Productions</p>
      <form id="login-form">
        <label class="upload-label" for="login-password">Password</label>
        <input type="password" id="login-password" class="url-input" placeholder="Enter team password" required autofocus>
        <button type="submit" class="login-btn" id="login-btn">Sign In</button>
      </form>
      <div id="login-error" class="error" hidden></div>
    </div>
  </div>

  <div class="card hidden" id="main-card">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 5.92A6 6 0 0 1 12 2zm0 3.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" fill="none"/><circle cx="12" cy="12" r="4" fill="#fff"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <h1>Brief Generator</h1>
    </div>
    <p class="subtitle">Third Sun Productions</p>

    <form id="form">
      <div class="upload-area">
        <label class="upload-label" for="csv">Client Questionnaire</label>
        <div class="upload-zone" id="csv-zone">
          <div class="upload-icon">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="6" y="2" width="20" height="28" rx="3" fill="#e8eadb" stroke="#979E6C" stroke-width="1.5"/>
              <path d="M11 12h10M11 16h10M11 20h6" stroke="#979E6C" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <p class="upload-text"><strong>Choose CSV file(s)</strong> or drag them here</p>
          <input type="file" id="csv" name="csv" accept=".csv" multiple required>
        </div>
      </div>

      <div class="upload-area">
        <label class="upload-label" for="pdf">Project Contract</label>
        <div class="upload-zone" id="pdf-zone">
          <div class="upload-icon">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="6" y="2" width="20" height="28" rx="3" fill="#f2dce0" stroke="#D18E97" stroke-width="1.5"/>
              <path d="M11 12h10M11 16h10M11 20h6" stroke="#D18E97" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <p class="upload-text"><strong>Choose PDF file(s)</strong> or drag them here</p>
          <input type="file" id="pdf" name="pdf" accept=".pdf" multiple required>
        </div>
      </div>

      <div class="upload-area">
        <label class="upload-label" for="siteUrl">Current Website URL <span class="optional-note">(optional)</span></label>
        <input type="url" id="siteUrl" name="siteUrl" class="url-input"
          placeholder="https://www.clientsite.com">
      </div>

      <div class="divider"></div>

      <button type="submit" id="btn">Generate Brief</button>
    </form>

    <div id="status" class="status" hidden></div>
    <div id="preview-label" class="preview-label" hidden>Live Preview</div>
    <div id="preview" class="preview" hidden></div>
    <div id="downloads" class="downloads" hidden></div>
    <div id="revision-area" hidden>
      <div class="divider"></div>
      <label class="upload-label" for="feedback">Revise Brief</label>
      <textarea id="feedback" class="revision-textarea"
        placeholder="e.g. Make the tone more formal, add more detail to the Goals section..."
        rows="3"></textarea>
      <button type="button" id="revise-btn" class="revise-btn">Revise Brief</button>
    </div>
    <div id="error" class="error" hidden></div>
  </div>

  <script>
    // -----------------------------------------------------------------------
    // Auth
    // -----------------------------------------------------------------------
    const loginOverlay = document.getElementById("login-overlay");
    const mainCard = document.getElementById("main-card");
    const loginForm = document.getElementById("login-form");
    const loginBtn = document.getElementById("login-btn");
    const loginError = document.getElementById("login-error");
    const loginPassword = document.getElementById("login-password");

    function showLogin() {
      loginOverlay.classList.remove("hidden");
      mainCard.classList.add("hidden");
      loginPassword.value = "";
      loginError.hidden = true;
    }

    function showApp() {
      loginOverlay.classList.add("hidden");
      mainCard.classList.remove("hidden");
    }

    // Check auth on page load
    (async () => {
      try {
        const res = await fetch("/auth-check");
        const data = await res.json();
        if (data.authenticated) showApp();
      } catch (_) { /* show login by default */ }
    })();

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginBtn.disabled = true;
      loginError.hidden = true;
      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: loginPassword.value }),
        });
        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.error || "Login failed");
        }
        showApp();
      } catch (err) {
        loginError.textContent = err.message;
        loginError.hidden = false;
      } finally {
        loginBtn.disabled = false;
      }
    });

    // Helper: handle 401 from any fetch
    function handle401(res) {
      if (res.status === 401) {
        showLogin();
        return true;
      }
      return false;
    }

    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const statusEl = document.getElementById("status");
    const previewLabel = document.getElementById("preview-label");
    const previewEl = document.getElementById("preview");
    const downloadsEl = document.getElementById("downloads");
    const errorEl = document.getElementById("error");
    const revisionArea = document.getElementById("revision-area");
    const feedbackEl = document.getElementById("feedback");
    const reviseBtn = document.getElementById("revise-btn");
    let currentSessionId = null;

    // CSV client-side validation
    let csvValid = false;

    function validateCsvText(text) {
      if (!text || !text.trim()) return "CSV file is empty.";
      const lines = text.trim().split(/\r?\n/).filter((l) => l.trim() !== "");
      if (!lines[0].includes(",")) return "File does not appear to be a valid CSV (no commas found).";
      if (lines.length < 2) return "CSV has no data rows (only a header was found).";
      return null;
    }

    function clearUploadError(zone) {
      zone.classList.remove("has-error");
      const existing = zone.parentElement.querySelector(".upload-error");
      if (existing) existing.remove();
    }

    function showUploadError(zone, message) {
      clearUploadError(zone);
      zone.classList.add("has-error");
      zone.classList.remove("has-file");
      const el = document.createElement("p");
      el.className = "upload-error";
      el.textContent = message;
      zone.parentElement.appendChild(el);
    }

    // File input display — PDF (no validation needed)
    document.getElementById("pdf").addEventListener("change", function () {
      const zone = this.closest(".upload-zone");
      if (this.files.length) {
        zone.classList.add("has-file");
        zone.querySelector(".upload-icon").hidden = true;
        const names = Array.from(this.files).map((f) => f.name);
        const label = names.length === 1 ? names[0] : `${names.length} files selected`;
        zone.querySelector(".upload-text").innerHTML =
          '<span class="file-name"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>' +
          label + '</span>';
      }
    });

    // File input display — CSV (with validation)
    document.getElementById("csv").addEventListener("change", async function () {
      const zone = this.closest(".upload-zone");
      clearUploadError(zone);
      csvValid = false;

      if (!this.files.length) return;

      const files = Array.from(this.files);
      for (const file of files) {
        const text = await file.text();
        const err = validateCsvText(text);
        if (err) {
          zone.querySelector(".upload-icon").hidden = false;
          zone.querySelector(".upload-text").innerHTML = '<strong>Choose CSV file(s)</strong> or drag them here';
          showUploadError(zone, files.length > 1 ? `${file.name}: ${err}` : err);
          this.value = "";
          return;
        }
      }

      csvValid = true;
      zone.classList.add("has-file");
      zone.querySelector(".upload-icon").hidden = true;
      const names = files.map((f) => f.name);
      const label = names.length === 1 ? names[0] : `${names.length} files selected`;
      zone.querySelector(".upload-text").innerHTML =
        '<span class="file-name"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>' +
        label + '</span>';
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const csvFiles = document.getElementById("csv").files;
      const pdfFiles = document.getElementById("pdf").files;
      if (!csvFiles.length || !pdfFiles.length) return;
      if (!csvValid) return;

      currentSessionId = null;
      revisionArea.hidden = true;
      feedbackEl.value = "";
      downloadsEl.hidden = true;
      errorEl.hidden = true;
      downloadsEl.innerHTML = "";
      previewEl.hidden = true;
      previewLabel.hidden = true;
      previewEl.textContent = "";
      btn.disabled = true;
      statusEl.hidden = false;
      statusEl.innerHTML = '<span class="spinner"></span>Generating brief...';

      const formData = new FormData();
      for (const file of csvFiles) formData.append("csv", file);
      for (const file of pdfFiles) formData.append("pdf", file);
      const siteUrl = document.getElementById("siteUrl").value.trim();
      if (siteUrl) formData.append("siteUrl", siteUrl);

      try {
        const res = await fetch("/generate-stream", { method: "POST", body: formData });

        if (handle401(res)) return;
        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.error || "Server error");
        }

        previewLabel.hidden = false;
        previewEl.hidden = false;

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const json = JSON.parse(line.slice(6));

            if (json.error) throw new Error(json.error);

            if (json.done) {
              const docxBlob = new Blob(
                [Uint8Array.from(atob(json.docxBase64), (c) => c.charCodeAt(0))],
                { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" }
              );
              const mdBlob = new Blob([json.markdown], { type: "text/markdown" });
              const timestamp = new Date().toISOString().slice(0, 10);
              const slug = json.clientName
                ? json.clientName.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "")
                : null;
              const baseName = slug ? `creative-brief-${slug}-${timestamp}` : `creative-brief-${timestamp}`;

              const docxLink = document.createElement("a");
              docxLink.href = URL.createObjectURL(docxBlob);
              docxLink.download = `${baseName}.docx`;
              docxLink.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Download .docx';
              docxLink.className = "dl-docx";

              const mdLink = document.createElement("a");
              mdLink.href = URL.createObjectURL(mdBlob);
              mdLink.download = `${baseName}.md`;
              mdLink.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Download .md';
              mdLink.className = "dl-md";

              downloadsEl.appendChild(docxLink);
              downloadsEl.appendChild(mdLink);
              downloadsEl.hidden = false;
              currentSessionId = json.sessionId;
              statusEl.innerHTML = "Done!";
              revisionArea.hidden = false;
              continue;
            }

            if (json.text) {
              previewEl.textContent += json.text;
              previewEl.scrollTop = previewEl.scrollHeight;
            }
          }
        }
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.hidden = false;
        statusEl.hidden = true;
      } finally {
        btn.disabled = false;
      }
    });

    // Revision handler
    reviseBtn.addEventListener("click", async () => {
      const feedback = feedbackEl.value.trim();
      if (!feedback) {
        feedbackEl.focus();
        feedbackEl.style.borderColor = "var(--orange)";
        setTimeout(() => { feedbackEl.style.borderColor = ""; }, 2000);
        return;
      }
      if (!currentSessionId) {
        errorEl.textContent = "Session expired. Please generate a new brief first.";
        errorEl.hidden = false;
        return;
      }

      downloadsEl.hidden = true;
      downloadsEl.innerHTML = "";
      errorEl.hidden = true;
      previewEl.textContent = "";
      previewLabel.hidden = false;
      previewLabel.textContent = "Revised Preview";
      previewEl.hidden = false;
      reviseBtn.disabled = true;
      btn.disabled = true;
      statusEl.hidden = false;
      statusEl.innerHTML = '<span class="spinner"></span>Revising brief...';

      try {
        const res = await fetch("/revise-stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId: currentSessionId, feedback }),
        });

        if (handle401(res)) return;
        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.error || "Server error");
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const json = JSON.parse(line.slice(6));

            if (json.error) throw new Error(json.error);

            if (json.done) {
              currentSessionId = json.sessionId;

              const docxBlob = new Blob(
                [Uint8Array.from(atob(json.docxBase64), (c) => c.charCodeAt(0))],
                { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" }
              );
              const mdBlob = new Blob([json.markdown], { type: "text/markdown" });
              const timestamp = new Date().toISOString().slice(0, 10);
              const slug = json.clientName
                ? json.clientName.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "")
                : null;
              const baseName = slug ? `creative-brief-${slug}-${timestamp}` : `creative-brief-${timestamp}`;

              const docxLink = document.createElement("a");
              docxLink.href = URL.createObjectURL(docxBlob);
              docxLink.download = `${baseName}.docx`;
              docxLink.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Download .docx';
              docxLink.className = "dl-docx";

              const mdLink = document.createElement("a");
              mdLink.href = URL.createObjectURL(mdBlob);
              mdLink.download = `${baseName}.md`;
              mdLink.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Download .md';
              mdLink.className = "dl-md";

              downloadsEl.appendChild(docxLink);
              downloadsEl.appendChild(mdLink);
              downloadsEl.hidden = false;
              statusEl.innerHTML = "Done!";
              feedbackEl.value = "";
              continue;
            }

            if (json.text) {
              previewEl.textContent += json.text;
              previewEl.scrollTop = previewEl.scrollHeight;
            }
          }
        }
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.hidden = false;
        statusEl.hidden = true;
      } finally {
        reviseBtn.disabled = false;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
