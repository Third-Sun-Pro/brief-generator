<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brief Generator - Third Sun Productions</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap');

    :root {
      --cream: #EAE1CB;
      --pink: #D18E97;
      --green: #979E6C;
      --brown: #5B3B1E;
      --gold: #D2A432;
      --orange: #BC5727;
      --cream-light: #f3efe6;
      --cream-dark: #ddd4be;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--cream-light);
      color: var(--brown);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(91, 59, 30, 0.10), 0 1px 4px rgba(91, 59, 30, 0.06);
      padding: 3rem;
      max-width: 500px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--pink), var(--green), var(--cream), var(--pink));
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.3rem;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--green);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--brown);
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--green);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 2.25rem;
      letter-spacing: 0.02em;
    }

    .upload-area {
      margin-bottom: 1rem;
    }

    .upload-label {
      display: block;
      font-weight: 600;
      font-size: 0.8rem;
      margin-bottom: 0.5rem;
      color: var(--brown);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .upload-zone {
      position: relative;
      border: 2px dashed var(--cream-dark);
      border-radius: 12px;
      padding: 1.25rem 1rem;
      background: var(--cream-light);
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .upload-zone:hover {
      border-color: var(--pink);
      background: #f5eced;
    }

    .upload-zone.has-file {
      border-color: var(--green);
      border-style: solid;
      background: #f0f1e8;
    }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .upload-icon {
      display: inline-block;
      width: 32px;
      height: 32px;
      margin-bottom: 0.4rem;
    }

    .upload-text {
      font-size: 0.85rem;
      color: #9a8a6e;
    }

    .upload-text strong {
      color: var(--pink);
    }

    .file-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .file-name svg {
      width: 16px;
      height: 16px;
      fill: var(--green);
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.9rem;
      background: var(--pink);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 0.75rem;
      letter-spacing: 0.01em;
    }

    button[type="submit"]:hover {
      background: #c07a83;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(209, 142, 151, 0.35);
    }

    button[type="submit"]:disabled {
      background: #d4b8bc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .status {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: var(--brown);
      font-weight: 500;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2.5px solid var(--cream-dark);
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .downloads {
      margin-top: 1.5rem;
      display: flex;
      gap: 0.75rem;
    }

    .downloads a {
      flex: 1;
      text-align: center;
      padding: 0.75rem;
      border-radius: 12px;
      text-decoration: none;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .downloads a svg {
      width: 16px;
      height: 16px;
    }

    .dl-docx {
      background: var(--green);
      color: #fff;
    }
    .dl-docx:hover {
      background: #858c5e;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(151, 158, 108, 0.3);
    }
    .dl-docx svg { fill: #fff; }

    .dl-md {
      background: var(--cream);
      color: var(--brown);
    }
    .dl-md:hover {
      background: var(--cream-dark);
      transform: translateY(-1px);
    }
    .dl-md svg { fill: var(--brown); }

    .error {
      color: var(--orange);
      background: #f9eeea;
      border: 1px solid #e8d0c4;
      border-radius: 12px;
      padding: 0.85rem 1rem;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .divider {
      height: 1px;
      background: var(--cream-dark);
      margin: 1.75rem 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 5.92A6 6 0 0 1 12 2zm0 3.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" fill="none"/><circle cx="12" cy="12" r="4" fill="#fff"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <h1>Brief Generator</h1>
    </div>
    <p class="subtitle">Third Sun Productions</p>

    <form id="form">
      <div class="upload-area">
        <label class="upload-label" for="csv">Client Questionnaire</label>
        <div class="upload-zone" id="csv-zone">
          <div class="upload-icon">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="6" y="2" width="20" height="28" rx="3" fill="#e8eadb" stroke="#979E6C" stroke-width="1.5"/>
              <path d="M11 12h10M11 16h10M11 20h6" stroke="#979E6C" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <p class="upload-text"><strong>Choose CSV file(s)</strong> or drag them here</p>
          <input type="file" id="csv" name="csv" accept=".csv" multiple required>
        </div>
      </div>

      <div class="upload-area">
        <label class="upload-label" for="pdf">Project Contract</label>
        <div class="upload-zone" id="pdf-zone">
          <div class="upload-icon">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="6" y="2" width="20" height="28" rx="3" fill="#f2dce0" stroke="#D18E97" stroke-width="1.5"/>
              <path d="M11 12h10M11 16h10M11 20h6" stroke="#D18E97" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <p class="upload-text"><strong>Choose PDF file(s)</strong> or drag them here</p>
          <input type="file" id="pdf" name="pdf" accept=".pdf" multiple required>
        </div>
      </div>

      <div class="divider"></div>

      <button type="submit" id="btn">Generate Brief</button>
    </form>

    <div id="status" class="status" hidden></div>
    <div id="downloads" class="downloads" hidden></div>
    <div id="error" class="error" hidden></div>
  </div>

  <script>
    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const statusEl = document.getElementById("status");
    const downloadsEl = document.getElementById("downloads");
    const errorEl = document.getElementById("error");

    // File input display
    document.querySelectorAll('.upload-zone input[type="file"]').forEach((input) => {
      input.addEventListener("change", () => {
        const zone = input.closest(".upload-zone");
        if (input.files.length) {
          zone.classList.add("has-file");
          zone.querySelector(".upload-icon").hidden = true;
          const names = Array.from(input.files).map((f) => f.name);
          const label = names.length === 1
            ? names[0]
            : `${names.length} files selected`;
          zone.querySelector(".upload-text").innerHTML =
            '<span class="file-name"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>' +
            label + '</span>';
        }
      });
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const csvFiles = document.getElementById("csv").files;
      const pdfFiles = document.getElementById("pdf").files;
      if (!csvFiles.length || !pdfFiles.length) return;

      downloadsEl.hidden = true;
      errorEl.hidden = true;
      downloadsEl.innerHTML = "";
      btn.disabled = true;
      statusEl.hidden = false;
      statusEl.innerHTML = '<span class="spinner"></span>Generating brief... this may take a minute.';

      const formData = new FormData();
      for (const file of csvFiles) formData.append("csv", file);
      for (const file of pdfFiles) formData.append("pdf", file);

      try {
        const res = await fetch("/generate", { method: "POST", body: formData });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || "Server error");

        const docxBlob = new Blob(
          [Uint8Array.from(atob(data.docxBase64), (c) => c.charCodeAt(0))],
          { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" }
        );
        const mdBlob = new Blob([data.markdown], { type: "text/markdown" });
        const timestamp = new Date().toISOString().slice(0, 10);

        const docxLink = document.createElement("a");
        docxLink.href = URL.createObjectURL(docxBlob);
        docxLink.download = `creative-brief-${timestamp}.docx`;
        docxLink.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Download .docx';
        docxLink.className = "dl-docx";

        const mdLink = document.createElement("a");
        mdLink.href = URL.createObjectURL(mdBlob);
        mdLink.download = `creative-brief-${timestamp}.md`;
        mdLink.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Download .md';
        mdLink.className = "dl-md";

        downloadsEl.appendChild(docxLink);
        downloadsEl.appendChild(mdLink);
        downloadsEl.hidden = false;
        statusEl.innerHTML = "Done!";
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.hidden = false;
        statusEl.hidden = true;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
